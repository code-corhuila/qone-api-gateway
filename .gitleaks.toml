# The default rules, plus OpenAI keys in every format: the default rule only knows the old
# `T3BlbkFJ` shape, and an OPENAI_API_KEY pasted into a script, an example or a document must fail
# the scan (code-corhuila/qone-docs#55). Nothing of this repository is allowlisted.
# The whole key is the secret (group 1): with the prefix as the only group, gitleaks measured the
# entropy of `proj-` alone and dropped every real key. \b keeps words such as `task-...` out, and
# the entropy floor keeps placeholders such as `sk-proj-xxxx...` out.
[extend]
useDefault = true

[[rules]]
id = "openai-api-key"
description = "OpenAI API key (sk-, sk-proj-, sk-svcacct-, sk-admin-)"
regex = '''\b(sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,})'''
secretGroup = 1
entropy = 3
keywords = ["sk-"]
