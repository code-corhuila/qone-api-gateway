# The server: its own errors with the common envelope and the routes of every domain.
server {
    listen 8080;
    server_name _;

    include /etc/nginx/snippets/headers.conf;

    # The gateway's own errors use the envelope of _shared.yaml and the correlation id as traceId.
    error_page 401 = @unauthorized;
    error_page 404 = @not_found;
    error_page 429 = @too_many_requests;
    error_page 502 503 504 = @unavailable;
    proxy_intercept_errors off;

    location @unauthorized {
        include /etc/nginx/snippets/headers.conf;
        return 401 '{"error":"UNAUTHORIZED","message":"missing credential","traceId":"$correlation_id"}';
    }
    location @not_found {
        include /etc/nginx/snippets/headers.conf;
        return 404 '{"error":"NOT_FOUND","message":"resource not found","traceId":"$correlation_id"}';
    }
    location @too_many_requests {
        include /etc/nginx/snippets/headers.conf;
        add_header Retry-After 1 always;
        return 429 '{"error":"TOO_MANY_REQUESTS","message":"rate limit exceeded","traceId":"$correlation_id"}';
    }
    location @unavailable {
        include /etc/nginx/snippets/headers.conf;
        return 503 '{"error":"SERVICE_UNAVAILABLE","message":"the service is not available","traceId":"$correlation_id"}';
    }

    include /etc/nginx/routes/*.conf;

    # Anything else does not exist.
    location / {
        return 404;
    }
}
