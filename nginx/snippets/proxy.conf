# What every proxied location does: rate limit, correlation to the service, the client's
# facts, no buffering surprises. The location sets $upstream before including this file.
limit_req zone=api burst=40 nodelay;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Correlation-Id $correlation_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_pass $upstream;
