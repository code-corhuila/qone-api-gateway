# qone-api-gateway (Annex F, norm 5.6): the only entry of the platform. Configuration, not
# code: routes per domain, a cheap credential filter, rate limit, CORS, correlation and the
# common envelope for its own errors. Every service validates the token itself.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # One JSON line per request with the correlation id (norm 5.3.9): a user's reference
    # leads to this line and to the service's line with the same traceId.
    log_format qampus escape=json
        '{"time":"$time_iso8601","correlationId":"$correlation_id","method":"$request_method",'
        '"path":"$uri","status":$status,"upstream":"$upstream_addr","upstreamStatus":"$upstream_status",'
        '"durationMs":$request_time,"origin":"$http_origin","remote":"$remote_addr"}';
    access_log /dev/stdout qampus;

    # Explicit limits (norm 5.3.10): the gateway imposes what uvicorn cannot.
    client_max_body_size 1m;
    client_header_timeout 5s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
