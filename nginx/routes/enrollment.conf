# enrollment: /api/v1/enrollment/... to qone-enrollment-api (path forwarded intact, 07-api/guidelines.md §1).
# The name is resolved per request through a variable; a stopped qone-enrollment-api answers 503 here
# while every other domain keeps working.

    # Public: liveness (EN-01)
    location = /api/v1/enrollment/health {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        set $upstream http://qone-enrollment-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Public: certificate verification (EN-11)
    location /api/v1/enrollment/certificates/verify/ {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        set $upstream http://qone-enrollment-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/v1/enrollment/ {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        include /etc/nginx/snippets/protected.conf;
        set $upstream http://qone-enrollment-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }
