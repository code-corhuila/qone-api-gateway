# catalog: /api/v1/catalog/... to qone-catalog-api (path forwarded intact, 07-api/guidelines.md §1).
# The name is resolved per request through a variable; a stopped qone-catalog-api answers 503 here
# while every other domain keeps working.

    # Public: liveness (CA-01)
    location = /api/v1/catalog/health {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        set $upstream http://qone-catalog-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/v1/catalog/ {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        include /etc/nginx/snippets/protected.conf;
        set $upstream http://qone-catalog-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }
