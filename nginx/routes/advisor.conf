# advisor: /api/v1/advisor/... to qone-advisor-api (path forwarded intact, 07-api/guidelines.md §1).
# The name is resolved per request through a variable; a stopped qone-advisor-api answers 503 here
# while every other domain keeps working.

    # Public: liveness (AD-01)
    location = /api/v1/advisor/health {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        set $upstream http://qone-advisor-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Public: readiness (HU-PLT-004), 200 when its dependencies answer, 503 with the envelope if not
    location = /api/v1/advisor/health/ready {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        set $upstream http://qone-advisor-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/v1/advisor/ {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        include /etc/nginx/snippets/protected.conf;
        set $upstream http://qone-advisor-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }
