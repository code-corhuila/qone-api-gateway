# identity: /api/v1/identity/... to qone-identity-api (path forwarded intact, 07-api/guidelines.md §1).
# The name is resolved per request through a variable; a stopped qone-identity-api answers 503 here
# while every other domain keeps working.

    # Public: liveness (ID-01)
    location = /api/v1/identity/health {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        set $upstream http://qone-identity-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Public: register and login (ID-02, ID-03)
    location /api/v1/identity/auth/ {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        set $upstream http://qone-identity-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/v1/identity/ {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        include /etc/nginx/snippets/protected.conf;
        set $upstream http://qone-identity-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }
