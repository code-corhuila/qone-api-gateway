# billing: /api/v1/billing/... to qone-billing-api (path forwarded intact, 07-api/guidelines.md §1).
# The name is resolved per request through a variable; a stopped qone-billing-api answers 503 here
# while every other domain keeps working.

    # Public: liveness (BI-01)
    location = /api/v1/billing/health {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        set $upstream http://qone-billing-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/v1/billing/ {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        include /etc/nginx/snippets/protected.conf;
        set $upstream http://qone-billing-api:8000;
        include /etc/nginx/snippets/proxy.conf;
    }
