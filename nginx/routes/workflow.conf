# workflow: /api/v1/sagas to qone-workflow (Annex E). Protected: a user token starts a saga
# on behalf of the student; a SERVICE token does on behalf of the advisor (ADR-008).
    # Its health (WF-01) is public, like every service's.
    location = /api/v1/sagas/health {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        set $upstream http://qone-workflow:8000;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/v1/sagas {
        include /etc/nginx/snippets/headers.conf;
        include /etc/nginx/snippets/preflight.conf;
        include /etc/nginx/snippets/protected.conf;
        set $upstream http://qone-workflow:8000;
        include /etc/nginx/snippets/proxy.conf;
    }
